<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gitty</title>
    <meta name="description" content="Gitty — find, inspect, and compare open-source GitHub repositories." />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="site-header">
        <a href="#/" class="brand">
            <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38l-.01-1.49c-2.01.44-2.44-.97-2.44-.97-.33-.84-.81-1.06-.81-1.06-.66-.45.05-.44.05-.44.73.05 1.12.75 1.12.75.65 1.12 1.71.79 2.13.61.07-.47.26-.8.46-.98-1.61-.18-3.31-.8-3.31-3.6 0-.8.28-1.44.75-1.95-.08-.19-.33-.94.07-1.95 0 0 .61-.2 2 .74a6.9 6.9 0 0 1 3.65 0c1.39-.94 2-.74 2-.74.4 1.01.15 1.76.07 1.95.47.51.75 1.15.75 1.95 0 2.8-1.71 3.42-3.33 3.6.27.23.5.68.5 1.38l-.01 2.04c0 .21.15.45.55.38A8 8 0 0 0 8 0Z"/></svg>
            <span>Gitty</span>
        </a>
        <form id="global-search-form" class="global-search">
            <input id="global-search-input" type="search" placeholder="Search repos, e.g. &quot;rag vector database&quot;" autocomplete="off" />
        </form>
        <button id="settings-toggle" class="icon-button" title="Settings" aria-label="Settings">⚙</button>
    </header>

    <nav class="site-nav">
        <a href="#/" class="nav-link" data-nav="search">Search</a>
        <a href="#/trending" class="nav-link" data-nav="trending">Trending</a>
        <a href="#/compare" class="nav-link" data-nav="compare">Compare</a>
    </nav>

    <div id="settings-panel" class="settings-panel" hidden>
        <label for="token-input">Your GitHub token <span class="muted">(optional — raises your rate limit)</span></label>
        <input id="token-input" type="password" placeholder="ghp_..." autocomplete="off" />
        <div class="settings-actions">
            <button id="token-save" class="btn btn-primary">Save</button>
            <button id="token-clear" class="btn">Clear</button>
        </div>
        <p class="muted small">Stored only in your browser (localStorage), sent as an Authorization header directly to the API. Never sent anywhere else.</p>

        <hr class="settings-divider" />

        <label for="ai-provider-input">AI explanations <span class="muted">(optional — a few are free per day; add your own key for unlimited)</span></label>
        <select id="ai-provider-input">
            <option value="gemini">Google Gemini</option>
            <option value="anthropic">Anthropic (Claude)</option>
        </select>
        <input id="ai-key-input" type="password" placeholder="Your AI API key (leave blank to use the free daily trial)" autocomplete="off" />
        <div class="settings-actions">
            <button id="ai-key-save" class="btn btn-primary">Save</button>
            <button id="ai-key-clear" class="btn">Clear</button>
        </div>
        <p class="muted small">Also stored only in your browser, sent directly to the API as request headers. Never sent anywhere else.</p>
    </div>

    <main id="app" aria-live="polite"></main>

    <footer class="site-footer">
        <span>Gitty — <a href="https://github.com/Hemanth-hexo/Git_mcp" target="_blank" rel="noopener">source</a></span>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.12/lib/marked.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.15/purify.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
